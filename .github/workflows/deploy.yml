# Baut die Website und überträgt sie per FTPS auf den Webspace (All-Inkl).
#
#   Push auf main (auch Veröffentlichungen aus dem CMS), täglich 4:17 Uhr (Instagram-Feed),
#   manuell über „Run workflow“:
#     → Live      (Secret DEPLOY_PATH). Die Vorschau neu.thinkfox.de wurde am 09.11.2026 abgebaut.
#
# Secrets (GitHub → Repository oder Organisation → Settings → Secrets and variables → Actions):
#   FTP_HOST         FTP-Server, bei All-Inkl z. B. w0123456.kasserver.com
#   FTP_USER         FTP-Benutzer (empfohlen: eigener Benutzer nur für das Zielverzeichnis)
#   FTP_PASSWORD     Passwort des FTP-Benutzers
#   DEPLOY_PATH      Zielverzeichnis der Live-Seite
#   LIVE_FTP_USER    optional: eigener FTP-Benutzer nur für das Live-Verzeichnis (dann DEPLOY_PATH = /)
#   LIVE_FTP_PASSWORD  dessen Passwort
#   INSTAGRAM_TOKEN  optional, für die Aktualisierung des Instagram-Feeds
# Ohne Zielverzeichnis wird nur gebaut (Ergebnis als Artefakt herunterladbar).
name: Build & Deploy

on:
  push:
    branches: [main]
    # Reine Doku-Änderungen lösen keinen Deploy aus (spart Actions-Minuten). Nur docs/ und .md im Hauptordner
    # (README, CLAUDE) – NICHT '**/*.md': sonst würden CMS-Inhalte (src/content/**/*.md) nie veröffentlicht.
    paths-ignore: ['docs/**', '*.md']
  # Täglicher Lauf nur für den Instagram-Feed – erst wieder einschalten, wenn INSTAGRAM_TOKEN gesetzt ist:
  # schedule:
  #   - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Instagram-Feed aktualisieren
        continue-on-error: true   # Störung bei Instagram blockiert keinen Deploy (letzter Stand bleibt)
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
        run: npm run instagram

      # OpenStreetMap-Kacheln der Kontakt-Karte nicht bei jedem Build neu laden (OSM-Nutzungsregeln)
      - uses: actions/cache@v4
        with:
          path: .osm-cache
          key: osm-karte-v1

      # WebP-Fassungen der Bilder nicht bei jedem Build neu kodieren (scripts/astro-webp.mjs)
      - uses: actions/cache@v4
        with:
          path: .webp-cache
          key: webp-${{ github.run_id }}
          restore-keys: webp-

      - run: npm run build

      # CMS-Oberfläche (/admin/) und CMS-Login nicht veröffentlichen: Pflege läuft über das Repo (11/2026).
      # Bleibt im Repo (lokal: npm run cms). Wieder aktivieren = diesen Schritt entfernen + OAuth-App in api/config.php.
      # deploy-ftp.sh spiegelt mit --delete: beides verschwindet damit auch vom Server.
      - name: CMS ohne Login nicht veröffentlichen
        run: rm -rf dist/admin dist/api/cms-auth.php

      - name: Artefakt speichern
        uses: actions/upload-artifact@v5
        with:
          name: website
          path: dist
          retention-days: 1

      - name: lftp installieren
        if: env.DEPLOY_PATH != ''
        run: sudo apt-get install -y -qq lftp > /dev/null

      - name: Live-Seite übertragen
        if: env.DEPLOY_PATH != ''
        env:
          # Eigener FTP-Benutzer nur für das Live-Verzeichnis; ohne LIVE_FTP_USER wird FTP_USER verwendet
          LIVE_FTP_USER: ${{ secrets.LIVE_FTP_USER }}
          LIVE_FTP_PASSWORD: ${{ secrets.LIVE_FTP_PASSWORD }}
        run: |
          if [ -n "$LIVE_FTP_USER" ]; then export FTP_USER="$LIVE_FTP_USER" FTP_PASSWORD="$LIVE_FTP_PASSWORD"; else echo "::warning::LIVE_FTP_USER fehlt – es wird FTP_USER verwendet"; fi
          scripts/deploy-ftp.sh dist "$DEPLOY_PATH"
