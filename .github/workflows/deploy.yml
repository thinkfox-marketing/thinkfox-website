# Baut die Website und überträgt sie per FTPS (FTP mit TLS) auf den Webspace (All-Inkl).
#
#   Push auf main                          → Produktion  (Secret DEPLOY_PATH)
#   Push auf claude/ecstatic-feynman-godndt → Staging     (Secret STAGING_PATH, für Suchmaschinen gesperrt)
#   täglich 4:17 Uhr (Instagram-Feed) und manuell über „Run workflow“
#
# Repository-Secrets (GitHub → Settings → Secrets and variables → Actions):
#   FTP_HOST         FTP-Server, bei All-Inkl z. B. w0123456.kasserver.com
#   FTP_USER         FTP-Benutzer (empfohlen: eigener Benutzer nur für das Zielverzeichnis)
#   FTP_PASSWORD     Passwort des FTP-Benutzers
#   STAGING_PATH     Zielverzeichnis aus Sicht des FTP-Benutzers, bei eigenem Benutzer meist /
#   DEPLOY_PATH      Zielverzeichnis der Live-Domain (erst beim Umzug setzen)
#   INSTAGRAM_TOKEN  optional, für die Aktualisierung des Instagram-Feeds
# Ohne passendes Zielverzeichnis wird nur gebaut (Ergebnis als Artefakt herunterladbar).
name: Build & Deploy

on:
  push:
    branches: [main, claude/ecstatic-feynman-godndt]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      STAGING: ${{ github.ref != 'refs/heads/main' }}
      TARGET_PATH: ${{ github.ref == 'refs/heads/main' && secrets.DEPLOY_PATH || secrets.STAGING_PATH }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Instagram-Feed aktualisieren
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
        run: npm run instagram

      - run: npm run build

      - name: Staging für Suchmaschinen sperren
        if: env.STAGING == 'true'
        run: |
          printf 'User-Agent: *\nDisallow: /\n' > dist/robots.txt
          printf '\n<IfModule mod_headers.c>\n  Header always set X-Robots-Tag "noindex, nofollow"\n</IfModule>\n' >> dist/.htaccess
          # Unbekannte Adressen nicht auf die Live-Domain umleiten
          sed -i 's#https://thinkfox.de%{REQUEST_URI}#https://%{HTTP_HOST}%{REQUEST_URI}#' dist/.htaccess

      - name: Artefakt speichern
        uses: actions/upload-artifact@v4
        with:
          name: website
          path: dist
          retention-days: 7

      - name: Auf den Webspace übertragen
        if: env.TARGET_PATH != ''
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get install -y -qq lftp > /dev/null
          TARGET="${TARGET_PATH%/}/"
          ftp() {
            lftp -u "$FTP_USER,$FTP_PASSWORD" "$FTP_HOST" -e "
              set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate yes;
              set net:max-retries 3; set net:timeout 30; $1; bye"
          }

          # Erstinstallation: Formular-Konfiguration anlegen, falls noch keine existiert
          # (danach nur noch auf dem Server pflegen – wird bei Deploys nie überschrieben)
          if ! ftp "cls -1 ${TARGET}api/config.php" > /dev/null 2>&1; then
            SECRET=$(openssl rand -hex 32)
            sed "s/'BITTE-AENDERN-' . 'mindestens-32-zeichen-zufall'/'$SECRET'/" public/api/config.example.php > /tmp/config.php
            ftp "mkdir -p -f ${TARGET}api; put /tmp/config.php -o ${TARGET}api/config.php"
          fi

          # 1. Alle Dateien abgleichen (neu/geändert nach Größe, gelöschte entfernen).
          #    api/config.php und api/data/ (Anfragen) bleiben auf dem Server unangetastet.
          # 2. Seiten und Konfigurationsdateien immer übertragen (können bei gleicher Größe geändert sein).
          EXCL="-x ^api/config\\.php$ -x ^api/data/"
          ftp "mirror -R --delete --ignore-time --parallel=8 $EXCL dist/ ${TARGET}"
          ftp "mirror -R --parallel=8 $EXCL -I *.html -I *.xml -I *.txt -I *.json -I *.yml -I *.php -I .htaccess dist/ ${TARGET}"
