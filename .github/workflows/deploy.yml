# Baut die Website und überträgt sie per FTPS auf den Webspace (All-Inkl).
#
#   Push auf main (auch Veröffentlichungen aus dem CMS), täglich 4:17 Uhr (Instagram-Feed),
#   manuell über „Run workflow“:
#     → Vorschau  (Secret STAGING_PATH, z. B. neu.thinkfox.de – für Suchmaschinen gesperrt)
#     → Live      (Secret DEPLOY_PATH – erst beim Umzug der Domain setzen)
#
# Secrets (GitHub → Repository oder Organisation → Settings → Secrets and variables → Actions):
#   FTP_HOST         FTP-Server, bei All-Inkl z. B. w0123456.kasserver.com
#   FTP_USER         FTP-Benutzer (empfohlen: eigener Benutzer nur für das Zielverzeichnis)
#   FTP_PASSWORD     Passwort des FTP-Benutzers
#   STAGING_PATH     Zielverzeichnis der Vorschau aus Sicht des FTP-Benutzers, bei eigenem Benutzer: /
#   DEPLOY_PATH      Zielverzeichnis der Live-Seite
#   INSTAGRAM_TOKEN  optional, für die Aktualisierung des Instagram-Feeds
# Ohne Zielverzeichnis wird nur gebaut (Ergebnis als Artefakt herunterladbar).
name: Build & Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      STAGING_PATH: ${{ secrets.STAGING_PATH }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Instagram-Feed aktualisieren
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
        run: npm run instagram

      # OpenStreetMap-Kacheln der Kontakt-Karte nicht bei jedem Build neu laden (OSM-Nutzungsregeln)
      - uses: actions/cache@v4
        with:
          path: .osm-cache
          key: osm-karte-v1

      - run: npm run build

      - name: CMS-Login (GitHub-OAuth) aus Secrets
        env:
          CMS_GITHUB_CLIENT_ID: ${{ secrets.CMS_GITHUB_CLIENT_ID }}
          CMS_GITHUB_CLIENT_SECRET: ${{ secrets.CMS_GITHUB_CLIENT_SECRET }}
        run: |
          if [ -n "$CMS_GITHUB_CLIENT_ID" ] && [ -n "$CMS_GITHUB_CLIENT_SECRET" ]; then
            printf "<?php\nreturn ['client_id' => '%s', 'client_secret' => '%s'];\n" "$CMS_GITHUB_CLIENT_ID" "$CMS_GITHUB_CLIENT_SECRET" > dist/api/config-github.php
            echo "CMS-Login eingerichtet"
          else
            echo "CMS-Login: Secrets CMS_GITHUB_CLIENT_ID/-SECRET fehlen"
          fi

      - name: Vorschau-Version erzeugen (für Suchmaschinen gesperrt)
        run: |
          cp -a dist dist-staging
          # CMS-Anmeldung über die Vorschau-Adresse (thinkfox.de läuft noch auf WordPress)
          sed -i "s#^  base_url: https://thinkfox.de#  base_url: https://${STAGING_HOST:-neu.thinkfox.de}#; s#^site_url: https://thinkfox.de#site_url: https://${STAGING_HOST:-neu.thinkfox.de}#" dist-staging/admin/config.yml
          printf 'User-Agent: *\nDisallow: /\n' > dist-staging/robots.txt
          printf '\n<IfModule mod_headers.c>\n  Header always set X-Robots-Tag "noindex, nofollow"\n</IfModule>\n' >> dist-staging/.htaccess
          # https-Weiterleitung auf die eigene Adresse statt auf thinkfox.de
          sed -i 's#https://thinkfox.de%{REQUEST_URI}#https://%{HTTP_HOST}%{REQUEST_URI}#' dist-staging/.htaccess

      - name: Artefakt speichern
        uses: actions/upload-artifact@v5
        with:
          name: website
          path: dist
          retention-days: 7

      - name: lftp installieren
        if: env.STAGING_PATH != '' || env.DEPLOY_PATH != ''
        run: sudo apt-get install -y -qq lftp > /dev/null

      - name: Vorschau übertragen
        if: env.STAGING_PATH != ''
        run: scripts/deploy-ftp.sh dist-staging "$STAGING_PATH"

      - name: Live-Seite übertragen
        if: env.DEPLOY_PATH != ''
        run: scripts/deploy-ftp.sh dist "$DEPLOY_PATH"
